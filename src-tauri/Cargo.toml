[package]
name = "light-ear-desktop"
version = "0.1.0"
edition = "2024"

[features]
default = []
fdk-aac-decoder = ["light-ear/fdk-aac-decoder"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
libp2p = { version = "0.56.0", default-features = false }
light-ear = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
