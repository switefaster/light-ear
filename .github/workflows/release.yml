name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft:
    name: Prepare release draft
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v6

      - name: Check tag against package versions
        shell: python
        run: |
          import json
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          versions = {}
          for name in ("Cargo.toml", "src-tauri/Cargo.toml"):
              versions[name] = tomllib.loads(Path(name).read_text())["package"]["version"]
          for name in ("package.json", "src-tauri/tauri.conf.json"):
              versions[name] = json.loads(Path(name).read_text())["version"]
          for name, version in versions.items():
              if tag != f"v{version}":
                  raise SystemExit(f"{name} declares {version}, but the tag is {tag}")
          if not Path(f"docs/releases/{tag}.md").is_file():
              raise SystemExit(f"Missing release notes for {tag}")

      - name: Test updater manifest generation
        run: node --test .github/scripts/updater-manifest.test.cjs

      - name: Create draft with release notes
        id: draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "light-ear ${{ github.ref_name }}"
          body_path: docs/releases/${{ github.ref_name }}.md
          files: docs/licenses/FDK-AAC-NOTICE.txt
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  release:
    needs: draft
    name: Release ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Check FDK AAC build
        run: |
          cargo check --locked --features fdk-aac-decoder
          cargo check --locked --manifest-path src-tauri/Cargo.toml --features fdk-aac-decoder

      - name: Build relay binary
        run: cargo build --locked --release --bin light-ear-relay --features fdk-aac-decoder

      - name: Package relay binary
        shell: bash
        run: |
          mkdir -p relay-dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/light-ear-relay.exe relay-dist/light-ear-relay-${{ matrix.platform }}.exe
          else
            cp target/release/light-ear-relay relay-dist/light-ear-relay-${{ matrix.platform }}
          fi

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: --features fdk-aac-decoder -- --locked

      - name: Upload relay binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" relay-dist/* --clobber

  updater-manifest:
    name: Generate updater manifest
    needs: [draft, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir "$RUNNER_TEMP/signatures"
          node .github/scripts/updater-manifest.cjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/signatures" > "$RUNNER_TEMP/latest.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" --clobber
